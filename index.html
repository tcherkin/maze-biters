<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maze Biters arcade game">
  <meta name="maze-biters-high-score-api" content="">
  <title>Maze Biters v1.01.93.00</title>
  <link rel="icon" type="image/png" href="assets/art/title/fallback/player.png">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body>
  <main class="wrap title-active" id="gameWrap">
    <canvas class="bitmap-hud" id="bitmapHud" width="1440" height="80"
      aria-label="Player scores, lives, snakes and level"></canvas>
    <div class="game-stage">
      <canvas id="game" width="1440" height="1080"
        aria-label="Maze Biters game and title menu"></canvas>
    </div>
    <div class="mode-controls" aria-label="Game mode selection">
      <button id="onePlayer">1 SOLO</button>
      <button id="twoPlayersCoop">2 DUO CO-OP</button>
      <button id="twoPlayers">3 DUO VS</button>
      <button id="onePlayerAi">4 SOLO VS AI</button>
      <button id="twoPlayersAi">5 DUO VS AI</button>
      <button class="ai-only" id="aiOnly">6 AI ONLY</button>
      <button id="howToPlay">How to Play</button>
    </div>
    <div id="screenReaderStatus" class="screen-reader-status"
      role="status" aria-live="polite" aria-atomic="true"></div>
    <input id="highScoreNameInput" class="high-score-name-input"
      type="text" inputmode="text" maxlength="10" autocomplete="nickname"
      autocapitalize="characters" spellcheck="false"
      aria-label="High score name, maximum 10 characters">
  </main>

  <script src="src/config/render-atlas.js"></script>
  <script src="src/config/audio-assets.js"></script>
  <script src="src/services/high-score-service.js?v=1.01.93.00"></script>
  <script src="src/render/dusk-lighting.js"></script>
  <script src="src/render/menu-lighting.js?v=1.01.93.00"></script>
  <script src="src/engine/game.js?v=1.01.93.00"></script>
</body>
</html>
