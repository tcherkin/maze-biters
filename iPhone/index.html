<body>
<canvas id="canvas" tabindex="0" aria-label="Maze Biters — игра"></canvas>
<div id="loading"><h1>MAZE BITERS</h1><div id="load-message">iPhone · Unity Web</div><progress id="progress" max="1" value="0"></progress><button id="start">Докосни за начало</button><button id="retry">Опитай отново</button><p class="hint">Плъзгай с пръст за движение. За двама: клавиатура или контролер. „4K“ използва пълната резолюция на дисплея, HD — половината по всяка ос.</p></div>

<script>
const canvas=document.querySelector('#canvas'),loading=document.querySelector('#loading'),message=document.querySelector('#load-message'),progress=document.querySelector('#progress'),asset=document.querySelector('#asset-status'),diag=document.querySelector('#diagnostic');
const parameters=new URLSearchParams(location.search),diagnostics=parameters.has('diagnostic');
let unity,fatalError=false,quality=parameters.get('quality')==='hd'?'hd':'4k';
if(diagnostics)diag.style.display='block';
// Explicit desktop previews are ordinary visible UI. On an iPhone the actual
// available WebView surface supplies the dimensions, including both orientations.
const fixtures={se:{w:667,h:375,dpr:2,name:'iPhone SE'},iphone:{w:844,h:390,dpr:3,name:'iPhone'},iphone17promax:{w:956,h:440,dpr:3,name:'iPhone 17 Pro Max'}};
const mobile=/iPhone|iPod|iPad|Android/i.test(navigator.userAgent||'')||Number(navigator.maxTouchPoints||0)>0;
const requestedPreview=parameters.get('preview');
const preview=fixtures[requestedPreview]||(requestedPreview===null&&!mobile?fixtures.iphone17promax:null);
let previewPortrait=false,resizeTimer=0;
window.mazePhonePortrait=false;window.mazePhoneHold=false;
window.mazePhoneViewport={nativeWidth:2868,nativeHeight:1320,left:0,right:0,top:0,bottom:0,revision:0,stable:1,portrait:0,cssWidth:956,cssHeight:440,dpr:3};
// A local bounded diagnostic survives a WebView process restart. An unfinished
// marker is evidence of an interrupted session, not proof of the cause.
const journalKey='MazeBiters:iPhoneWeb:v1:RuntimeDiagnostic';
let previousJournal=null,lastJournalSave=0,lastRequested=null;

const priorInterruption=previousCurrent&&previousCurrent.started?(previousCurrent.cleanExit?null:previousCurrent):(previousJournal&&previousJournal.version===1?previousJournal.previousInterrupted:null);
const journal={version:1,current:{started:false,cleanExit:false,stage:'page',contextLost:false,contextLosses:0,resizeCount:0},previousInterrupted:priorInterruption||null};
window.mazePhoneDiagnostics=journal;
function recordDiagnostics(event,force=false){
 const now=Date.now(),current=journal.current,metrics=window.mazePhoneViewport;
 current.event=event;current.updatedAt=now;current.quality=quality;current.native=[metrics.nativeWidth,metrics.nativeHeight];current.canvas=[canvas.width,canvas.height];current.revision=metrics.revision;
 if(lastRequested){current.requested={css:[lastRequested.w,lastRequested.h],dpr:lastRequested.dpr,pixels:[Math.floor(lastRequested.w*lastRequested.dpr+.5),Math.floor(lastRequested.h*lastRequested.dpr+.5)]};current.viewport=lastRequested.viewport;current.display=[lastRequested.x,lastRequested.y,lastRequested.displayW,lastRequested.displayH];}
 if(diagnostics)diag.textContent=JSON.stringify(journal,null,2);
 if(force||now-lastJournalSave>=2000){lastJournalSave=now;try{localStorage.setItem(journalKey,JSON.stringify(journal));}catch(e){}}
}
canvas.addEventListener('webglcontextlost',()=>{journal.current.contextLost=true;journal.current.contextLosses++;recordDiagnostics('context-lost',true);});
canvas.addEventListener('webglcontextrestored',()=>{journal.current.contextLost=false;recordDiagnostics('context-restored',true);});
window.addEventListener('pagehide',()=>{journal.current.cleanExit=!fatalError&&!journal.current.contextLost;recordDiagnostics('pagehide',true);});
window.addEventListener('pageshow',()=>{journal.current.cleanExit=false;recordDiagnostics('pageshow',true);});
function finitePositive(value,fallback){return Number.isFinite(Number(value))&&Number(value)>0?Number(value):fallback;}
function boundedPixels(width,height){
 const portrait=height>width,maxW=portrait?1320:2868,maxH=portrait?2868:1320,scale=Math.min(1,maxW/width,maxH/height);
 return {w:Math.max(1,Math.min(maxW,Math.floor(width*scale+.5))),h:Math.max(1,Math.min(maxH,Math.floor(height*scale+.5)))};
}
function surfacePixels(surface){return boundedPixels(surface.w*surface.dpr,surface.h*surface.dpr);}
function readSurface(){
 const view=window.visualViewport,root=document.documentElement;
 // Kiosker/Safari can report a smaller visual viewport near the display cutout
 // even with viewport-fit=cover. It is a visible subsection, not the complete
 // layout surface. Its size/offset must not crop or translate the game canvas.
 // Keep each width/height pair together, including during orientation changes.
 const pair=(w,h)=>Number.isFinite(Number(w))&&Number(w)>0&&Number.isFinite(Number(h))&&Number(h)>0;
 const source=pair(window.innerWidth,window.innerHeight)?'inner':pair(root&&root.clientWidth,root&&root.clientHeight)?'root':pair(view&&view.width,view&&view.height)?'visual-fallback':'reference-fallback';
 const w=source==='inner'?Number(window.innerWidth):source==='root'?Number(root.clientWidth):source==='visual-fallback'?Number(view.width):956;
 const h=source==='inner'?Number(window.innerHeight):source==='root'?Number(root.clientHeight):source==='visual-fallback'?Number(view.height):440;
 const number=value=>Number.isFinite(Number(value))?Number(value):null;
 const viewport={source,layout:[w,h],inner:[number(window.innerWidth),number(window.innerHeight)],root:[number(root&&root.clientWidth),number(root&&root.clientHeight)],visual:view?{width:number(view.width),height:number(view.height),left:number(view.offsetLeft),top:number(view.offsetTop),scale:number(view.scale)}:null};
 if(preview){const pw=previewPortrait?preview.h:preview.w,ph=previewPortrait?preview.w:preview.h,scale=Math.min(w/pw,h/ph);return {w:pw,h:ph,dpr:preview.dpr,displayW:pw*scale,displayH:ph*scale,x:(w-pw*scale)/2,y:(h-ph*scale)/2,portrait:previewPortrait,viewport};}

 return {w,h,dpr,displayW:w,displayH:h,x:0,y:0,portrait:h>w,viewport};
}
function layoutSurface(surface){
 canvas.style.left=surface.x+'px';canvas.style.top=surface.y+'px';canvas.style.width=surface.displayW+'px';canvas.style.height=surface.displayH+'px';canvas.style.margin='0';
 // The user deliberately selected the entire surface, with no notch padding.
 // Apply the same rectangle to overlays; all Unity HUD/content uses full frame.
 for(const el of [loading,document.querySelector('#rotate')]){el.style.left=surface.x+'px';el.style.top=surface.y+'px';el.style.width=surface.displayW+'px';el.style.height=surface.displayH+'px';el.style.right='auto';el.style.bottom='auto';}
 const right=Math.max(8,surface.viewport.layout[0]-surface.x-surface.displayW+8),bottom=Math.max(8,surface.viewport.layout[1]-surface.y-surface.displayH+8);
 const tools=document.querySelector('#tools');tools.style.right=right+'px';tools.style.bottom=bottom+'px';

}
function signalViewport(){window.dispatchEvent(new Event('maze-phone-viewport'));}
function applyBuffer(){
 const metrics=window.mazePhoneViewport,native=quality==='4k';
 const w=native?metrics.nativeWidth:Math.floor(metrics.nativeWidth/2+.5),h=native?metrics.nativeHeight:Math.floor(metrics.nativeHeight/2+.5);
 const changed=canvas.width!==w||canvas.height!==h;
 if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;
 if(changed){journal.current.resizeCount++;recordDiagnostics('buffer-resize',true);}
}
window.mazePhoneSetQuality=value=>{const next=value===1||value==='4k'?'4k':'hd';if(next!==quality){quality=next;applyBuffer();}else if(canvas.width===0||canvas.height===0)applyBuffer();};
function publishSurface(surface,retainNative=false){
 const metrics=window.mazePhoneViewport;
 // Retina backing pixels are independent of HD buffer downscaling. C# uses
 // these immutable surface dimensions to avoid recursive resize feedback.
 const bounded=surfacePixels(surface),nativeW=retainNative?metrics.nativeWidth:bounded.w,nativeH=retainNative?metrics.nativeHeight:bounded.h;
 const changed=metrics.nativeWidth!==nativeW||metrics.nativeHeight!==nativeH||metrics.dpr!==surface.dpr;
 metrics.nativeWidth=nativeW;metrics.nativeHeight=nativeH;metrics.cssWidth=surface.w;metrics.cssHeight=surface.h;metrics.dpr=surface.dpr;
 metrics.left=metrics.right=metrics.top=metrics.bottom=0;metrics.stable=1;metrics.portrait=0;if(changed)metrics.revision++;
 window.mazePhonePortrait=false;window.mazePhoneHold=false;document.querySelector('#rotate').style.display='none';
 applyBuffer();signalViewport();recordDiagnostics('viewport');
}
function fit(immediate=false){
 const surface=readSurface(),metrics=window.mazePhoneViewport;lastRequested=surface;layoutSurface(surface);clearTimeout(resizeTimer);resizeTimer=0;
 if(surface.portrait){window.mazePhonePortrait=true;window.mazePhoneHold=true;metrics.portrait=1;metrics.stable=0;document.querySelector('#rotate').style.display='flex';signalViewport();recordDiagnostics('portrait');return;}
 // Keep the committed pixel size through subpixel browser-toolbar jitter.
 // Compare against that committed size, so slow genuine resizing cannot drift
 // indefinitely inside a moving threshold. CSS still fills every available edge.
 const candidate=surfacePixels(surface),deadband=Math.max(1,Math.ceil(Math.max(surface.dpr,metrics.dpr)));
 const changed=Math.abs(metrics.nativeWidth-candidate.w)>deadband||Math.abs(metrics.nativeHeight-candidate.h)>deadband||metrics.dpr!==surface.dpr||window.mazePhonePortrait;
 if(immediate||!changed){publishSurface(surface,!immediate);return;}
 metrics.stable=0;window.mazePhoneHold=true;signalViewport();
 resizeTimer=setTimeout(()=>{resizeTimer=0;const stableSurface=readSurface();lastRequested=stableSurface;layoutSurface(stableSurface);if(stableSurface.portrait){fit(true);return;}publishSurface(stableSurface);},180);
}
window.addEventListener('resize',()=>fit());window.addEventListener('orientationchange',()=>fit());document.addEventListener('fullscreenchange',()=>fit());
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>fit());window.visualViewport.addEventListener('scroll',()=>fit());}
if(preview){document.querySelector('#preview-tools').style.display='flex';document.querySelector('#preview-label').textContent=preview.name+' · '+preview.w+'×'+preview.h+' CSS · '+preview.dpr+'×';document.querySelector('#preview-rotate').onclick=()=>{previewPortrait=!previewPortrait;fit();};}
fit(true);
window.mazeWebStatus=(text,value,phase)=>{if(fatalError)return;document.querySelector('#retry').style.display=phase<0?'block':'none';if(phase===0){loading.style.display='flex';message.textContent=text;progress.value=value;}else if(phase===1){loading.style.display='none';asset.textContent=text+' '+Math.round(value*100)+'%';}else if(phase===2){loading.style.display='none';asset.textContent='';}else{loading.style.display='flex';message.textContent=text;}};
window.mazeWebState=json=>{try{
 const state=JSON.parse(json),current=journal.current,changed=current.stage!==state.stage;
 current.stage=state.stage||current.stage;if(state.quality)window.mazePhoneSetQuality(state.quality);
 current.unity={stage:state.stage,quality:state.quality,pending:state.pending,ready:state.ready,mode:state.mode,error:String(state.error||'').slice(0,256)};
 if(state.game){const game=state.game;current.target=[game.renderWidth,game.renderHeight];current.level=game.level;current.gameTime=game.time;current.unity.game={level:game.level,players:game.players,time:game.time,paused:game.paused,pageHidden:game.pageHidden,renderWidth:game.renderWidth,renderHeight:game.renderHeight};}
 if(state.memory)current.memory=state.memory;recordDiagnostics('unity-state',changed);
}catch(e){}};
const errors=[];function failed(text){fatalError=true;errors.push(String(text));if(errors.length>16)errors.shift();journal.current.error=String(text).slice(0,256);recordDiagnostics('fatal-error',true);loading.style.display='flex';message.textContent=String(text);document.querySelector('#retry').style.display='block';}

async function boot(){
 if(window.mazePhonePortrait)return;
 journal.current.started=true;journal.current.cleanExit=false;journal.current.stage='loading';recordDiagnostics('start',true);
 document.querySelector('#start').style.display='none';message.textContent='Зареждане на играта…';
 try{const script=document.createElement('script');script.src='Build/981d67455e59b5e2c0fa910c624ceb1e5f108e460d0d79459d41c18e9172cd3e.loader.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.body.appendChild(script);});
 unity=await createUnityInstance(canvas,{dataUrl:'https://raw.githubusercontent.com/tcherkin/maze-biters/9b9b9c93a226538833fe7e0f268e3032b2f7fb31/iPhone/.runtime/3f4cbcab4d5cde467babf195dae6fdb0.data.unityweb',frameworkUrl:'Build/e8ee472a6f3bc7fad02ab1ce907e9f88b2a55045c3e1b5f89bfc8431ef05ed10.framework.js.unityweb',codeUrl:'Build/96a49794ebcfcf0b395e002e46ab576469e9bf35f292f2d9d9e599496ad93a6f.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Maze Biters',productName:'Maze Biters iPhone Web',productVersion:'1.0',matchWebGLToCanvasSize:false,autoSyncPersistentDataPath:true,cacheControl:url=>url==="https://raw.githubusercontent.com/tcherkin/maze-biters/9b9b9c93a226538833fe7e0f268e3032b2f7fb31/iPhone/.runtime/3f4cbcab4d5cde467babf195dae6fdb0.data.unityweb"?'immutable':'must-revalidate',showBanner:(text,type)=>{if(type==='error')failed(text);}},value=>{progress.value=value;message.textContent='Зареждане на играта… '+Math.round(value*100)+'%';});applyBuffer();canvas.focus();
 }catch(e){failed('Неуспешно зареждане. '+(e.message||e));}

document.querySelector('#start').onclick=boot;
document.querySelector('#retry').onclick=()=>{if(fatalError||!unity){location.reload();return;}document.querySelector('#retry').style.display='none';message.textContent='Повторно зареждане…';try{unity.SendMessage('Web loading','Retry');}catch(e){failed('Играта трябва да бъде презаредена.');}};
document.querySelector('#menu').onclick=()=>{unity?.SendMessage('Web loading','Menu');canvas.focus();};document.querySelector('#pause').onclick=()=>{unity?.SendMessage('Web loading','Pause');canvas.focus();};
function toggleFullscreen(){const operation=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();operation?.catch(()=>{});canvas.focus();}
document.querySelector('#full').onclick=toggleFullscreen;
let altEnterHeld=false;window.addEventListener('keydown',e=>{if(e.altKey&&(e.code==='Enter'||e.code==='NumpadEnter')){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat&&!altEnterHeld){altEnterHeld=true;toggleFullscreen();}}},true);
window.addEventListener('keyup',e=>{if(altEnterHeld&&(e.code==='Enter'||e.code==='NumpadEnter')){altEnterHeld=false;e.preventDefault();e.stopImmediatePropagation();}},true);window.addEventListener('blur',()=>{altEnterHeld=false;});
// Page controls own their input. A pause/menu touch or keyboard activation
// must never also become a swipe or a selection inside the canvas below it.
const pageKeys=new Set();for(const type of ['keydown','keyup'])window.addEventListener(type,e=>{const key=e.code||e.key,control=e.target&&e.target.closest&&e.target.closest('#tools,#loading,#rotate,#preview-tools');if(control||pageKeys.has(key)){if(type==='keydown')pageKeys.add(key);else pageKeys.delete(key);e.stopImmediatePropagation();}},true);
for(const type of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend','touchcancel','mousedown','mouseup'])window.addEventListener(type,e=>{if(e.target&&e.target.closest&&e.target.closest('#tools,#loading,#rotate,#preview-tools'))e.stopImmediatePropagation();},true);

document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script>
