<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#02080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Maze Biters · iPhone</title>
<style>
*{box-sizing:border-box}html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:#02080b;color:#d9f7f5;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}#canvas{position:fixed;display:block;outline:none;touch-action:none;margin:0}#loading,#rotate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at center,#08232b,#02080b 70%);z-index:5;padding:16px}#rotate{display:none;z-index:10;text-align:center}#rotate strong{font-size:clamp(22px,6vw,34px);font-weight:500}#rotate p{max-width:26em;color:#91bdc4;line-height:1.5}h1{letter-spacing:.18em;font-weight:500;font-size:clamp(22px,5vw,42px);margin:0}#load-message{min-height:24px;color:#91bdc4;text-align:center}progress{width:min(320px,70vw);height:6px;accent-color:#5de8cf}button,a{font:inherit;color:inherit;background:#09212b;border:1px solid #30606b;border-radius:8px;padding:10px 16px;text-decoration:none;cursor:pointer;touch-action:manipulation}button:hover{background:#15404d}#tools{position:fixed;bottom:8px;right:8px;display:flex;gap:6px;opacity:.65;z-index:4}#tools:hover,#tools:focus-within{opacity:1}#tools button{min-width:44px;min-height:44px;padding:6px 9px;font-size:13px}#asset-status{position:fixed;bottom:8px;left:10px;font-size:11px;color:#a0c5cc;pointer-events:none;max-width:60%}#diagnostic{display:none;position:fixed;left:0;top:0;max-width:100%;max-height:35%;overflow:auto;background:#000c;color:#b8ffc4;font:10px monospace;white-space:pre-wrap;pointer-events:none;z-index:8}.hint{text-align:center;max-width:46em;margin:0;padding:0 10px;color:#91adb5;font-size:13px;line-height:1.5}#retry{display:none}#preview-tools{position:fixed;left:8px;top:8px;display:none;align-items:center;gap:8px;z-index:12;background:#02080bd9;border-radius:6px;padding:3px 8px;color:#91bdc4;font-size:11px}#preview-rotate{padding:4px 8px;font-size:11px;min-height:30px}@media(max-height:340px){#loading{gap:8px;padding:8px}h1{font-size:24px}.hint{font-size:11px}}@media(pointer:coarse){#preview-tools{font-size:10px}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Maze Biters — игра"></canvas>
<div id="loading"><h1>MAZE BITERS</h1><div id="load-message">iPhone · Unity Web</div><progress id="progress" max="1" value="0"></progress><button id="start">Докосни за начало</button><button id="retry">Опитай отново</button><p class="hint">Плъзгай с пръст за движение. За двама: клавиатура или контролер. „4K“ използва пълната резолюция на дисплея, HD — половината по всяка ос.</p></div>
<div id="tools"><button id="pause" title="Пауза">Ⅱ</button><button id="menu">Меню</button><button id="full" title="Цял екран">⛶</button></div>
<div id="asset-status"></div><pre id="diagnostic"></pre>
<div id="rotate" role="status"><strong>Завърти телефона хоризонтално</strong><p>Играта продължава от същото място, когато върнеш телефона.</p></div>
<div id="preview-tools"><span id="preview-label"></span><button id="preview-rotate">Завърти прегледа</button></div>
<script>
const canvas=document.querySelector('#canvas'),loading=document.querySelector('#loading'),message=document.querySelector('#load-message'),progress=document.querySelector('#progress'),asset=document.querySelector('#asset-status'),diag=document.querySelector('#diagnostic');
const parameters=new URLSearchParams(location.search),diagnostics=parameters.has('diagnostic');
let unity,fatalError=false,quality=parameters.get('quality')==='hd'?'hd':'4k';
if(diagnostics)diag.style.display='block';
// Explicit desktop previews are ordinary visible UI. On an iPhone the actual
// available WebView surface supplies the dimensions, including both orientations.
const fixtures={se:{w:667,h:375,dpr:2,name:'iPhone SE'},iphone:{w:844,h:390,dpr:3,name:'iPhone'},iphone17promax:{w:956,h:440,dpr:3,name:'iPhone 17 Pro Max'}};
const mobile=/iPhone|iPod|iPad|Android/i.test(navigator.userAgent||'')||Number(navigator.maxTouchPoints||0)>0;
const requestedPreview=parameters.get('preview');
const preview=fixtures[requestedPreview]||(requestedPreview===null&&!mobile?fixtures.iphone17promax:null);
let previewPortrait=false,resizeTimer=0;
window.mazePhonePortrait=false;window.mazePhoneHold=false;
window.mazePhoneViewport={nativeWidth:2868,nativeHeight:1320,left:0,right:0,top:0,bottom:0,revision:0,stable:1,portrait:0,cssWidth:956,cssHeight:440,dpr:3};
function finitePositive(value,fallback){return Number.isFinite(Number(value))&&Number(value)>0?Number(value):fallback;}
function readSurface(){
 const view=window.visualViewport;
 const w=finitePositive(view&&view.width,finitePositive(innerWidth,956)),h=finitePositive(view&&view.height,finitePositive(innerHeight,440));
 if(preview){const pw=previewPortrait?preview.h:preview.w,ph=previewPortrait?preview.w:preview.h,scale=Math.min(w/pw,h/ph);return {w:pw,h:ph,dpr:preview.dpr,displayW:pw*scale,displayH:ph*scale,x:(w-pw*scale)/2,y:(h-ph*scale)/2,portrait:previewPortrait};}
 const dpr=Math.min(4,finitePositive(window.devicePixelRatio,1));
 return {w,h,dpr,displayW:w,displayH:h,x:Math.max(0,Number(view&&view.offsetLeft)||0),y:Math.max(0,Number(view&&view.offsetTop)||0),portrait:h>w};
}
function layoutSurface(surface){
 canvas.style.left=surface.x+'px';canvas.style.top=surface.y+'px';canvas.style.width=surface.displayW+'px';canvas.style.height=surface.displayH+'px';canvas.style.margin='0';
 // The user deliberately selected the entire surface, with no notch padding.
 // Apply the same rectangle to overlays; all Unity HUD/content uses full frame.
 for(const el of [loading,document.querySelector('#rotate')]){el.style.left=surface.x+'px';el.style.top=surface.y+'px';el.style.width=surface.displayW+'px';el.style.height=surface.displayH+'px';el.style.right='auto';el.style.bottom='auto';}
 const right=Math.max(8,innerWidth-surface.x-surface.displayW+8),bottom=Math.max(8,innerHeight-surface.y-surface.displayH+8);
 const tools=document.querySelector('#tools');tools.style.right=right+'px';tools.style.bottom=bottom+'px';
 asset.style.left=(surface.x+10)+'px';asset.style.bottom=bottom+'px';
}
function signalViewport(){window.dispatchEvent(new Event('maze-phone-viewport'));}
function applyBuffer(){
 const metrics=window.mazePhoneViewport,native=quality==='4k';
 const w=native?metrics.nativeWidth:Math.floor(metrics.nativeWidth/2+.5),h=native?metrics.nativeHeight:Math.floor(metrics.nativeHeight/2+.5);
 if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;
}
window.mazePhoneSetQuality=value=>{const next=value===1||value==='4k'?'4k':'hd';if(next!==quality){quality=next;applyBuffer();}else if(canvas.width===0||canvas.height===0)applyBuffer();};
function publishSurface(surface){
 const metrics=window.mazePhoneViewport;
 // Retina backing pixels are independent of HD buffer downscaling. C# uses
 // these immutable surface dimensions to avoid recursive resize feedback.
 const nativeW=Math.floor(surface.w*surface.dpr+.5),nativeH=Math.floor(surface.h*surface.dpr+.5);
 const changed=metrics.nativeWidth!==nativeW||metrics.nativeHeight!==nativeH||metrics.cssWidth!==surface.w||metrics.cssHeight!==surface.h||metrics.dpr!==surface.dpr;
 metrics.nativeWidth=nativeW;metrics.nativeHeight=nativeH;metrics.cssWidth=surface.w;metrics.cssHeight=surface.h;metrics.dpr=surface.dpr;
 metrics.left=metrics.right=metrics.top=metrics.bottom=0;metrics.stable=1;metrics.portrait=0;if(changed)metrics.revision++;
 window.mazePhonePortrait=false;window.mazePhoneHold=false;document.querySelector('#rotate').style.display='none';
 applyBuffer();signalViewport();
}
function fit(immediate=false){
 const surface=readSurface(),metrics=window.mazePhoneViewport;layoutSurface(surface);clearTimeout(resizeTimer);resizeTimer=0;
 if(surface.portrait){window.mazePhonePortrait=true;window.mazePhoneHold=true;metrics.portrait=1;metrics.stable=0;document.querySelector('#rotate').style.display='flex';signalViewport();return;}
 const changed=metrics.nativeWidth!==Math.floor(surface.w*surface.dpr+.5)||metrics.nativeHeight!==Math.floor(surface.h*surface.dpr+.5)||window.mazePhonePortrait;
 if(immediate||!changed){publishSurface(surface);return;}
 metrics.stable=0;window.mazePhoneHold=true;signalViewport();
 resizeTimer=setTimeout(()=>{resizeTimer=0;const stableSurface=readSurface();layoutSurface(stableSurface);if(stableSurface.portrait){fit(true);return;}publishSurface(stableSurface);},180);
}
window.addEventListener('resize',()=>fit());window.addEventListener('orientationchange',()=>fit());document.addEventListener('fullscreenchange',()=>fit());
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>fit());window.visualViewport.addEventListener('scroll',()=>fit());}
if(preview){document.querySelector('#preview-tools').style.display='flex';document.querySelector('#preview-label').textContent=preview.name+' · '+preview.w+'×'+preview.h+' CSS · '+preview.dpr+'×';document.querySelector('#preview-rotate').onclick=()=>{previewPortrait=!previewPortrait;fit();};}
fit(true);
window.mazeWebStatus=(text,value,phase)=>{if(fatalError)return;document.querySelector('#retry').style.display=phase<0?'block':'none';if(phase===0){loading.style.display='flex';message.textContent=text;progress.value=value;}else if(phase===1){loading.style.display='none';asset.textContent=text+' '+Math.round(value*100)+'%';}else if(phase===2){loading.style.display='none';asset.textContent='';}else{loading.style.display='flex';message.textContent=text;}};
window.mazeWebState=json=>{if(diagnostics)diag.textContent=json;try{const state=JSON.parse(json);if(state.quality)window.mazePhoneSetQuality(state.quality);}catch(e){}};
const errors=[];function failed(text){fatalError=true;errors.push(String(text));if(diagnostics)diag.textContent=errors.join('\n');loading.style.display='flex';message.textContent=String(text);document.querySelector('#retry').style.display='block';}
window.addEventListener('error',e=>{if(diagnostics){errors.push(e.message);diag.textContent=errors.join('\n');}});
async function boot(){
 if(window.mazePhonePortrait)return;
 document.querySelector('#start').style.display='none';message.textContent='Зареждане на играта…';
 try{const script=document.createElement('script');script.src='Build/ad911359453d08144df046627e69f907304a69f3cb880ae2d4e4b654432595ec.loader.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.body.appendChild(script);});
 unity=await createUnityInstance(canvas,{dataUrl:'Build/d9df0a3d7cf18501f425bb28fa320305.data.unityweb',frameworkUrl:'Build/bb738942626cde42d5a8a9af2d81e554.framework.js.unityweb',codeUrl:'Build/295fc3334ef66ab66f07ba2b6836001a.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Maze Biters',productName:'Maze Biters iPhone Web',productVersion:'1.0',matchWebGLToCanvasSize:false,autoSyncPersistentDataPath:true,cacheControl:url=>'must-revalidate',showBanner:(text,type)=>{if(type==='error')failed(text);}},value=>{progress.value=value;message.textContent='Зареждане на играта… '+Math.round(value*100)+'%';});applyBuffer();canvas.focus();
 }catch(e){failed('Неуспешно зареждане. '+(e.message||e));}
}
document.querySelector('#start').onclick=boot;
document.querySelector('#retry').onclick=()=>{if(fatalError||!unity){location.reload();return;}document.querySelector('#retry').style.display='none';message.textContent='Повторно зареждане…';try{unity.SendMessage('Web loading','Retry');}catch(e){failed('Играта трябва да бъде презаредена.');}};
document.querySelector('#menu').onclick=()=>{unity?.SendMessage('Web loading','Menu');canvas.focus();};document.querySelector('#pause').onclick=()=>{unity?.SendMessage('Web loading','Pause');canvas.focus();};
function toggleFullscreen(){const operation=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();operation?.catch(()=>{});canvas.focus();}
document.querySelector('#full').onclick=toggleFullscreen;
let altEnterHeld=false;window.addEventListener('keydown',e=>{if(e.altKey&&(e.code==='Enter'||e.code==='NumpadEnter')){e.preventDefault();e.stopImmediatePropagation();if(!e.repeat&&!altEnterHeld){altEnterHeld=true;toggleFullscreen();}}},true);
window.addEventListener('keyup',e=>{if(altEnterHeld&&(e.code==='Enter'||e.code==='NumpadEnter')){altEnterHeld=false;e.preventDefault();e.stopImmediatePropagation();}},true);window.addEventListener('blur',()=>{altEnterHeld=false;});
// Page controls own their input. A pause/menu touch or keyboard activation
// must never also become a swipe or a selection inside the canvas below it.
const pageKeys=new Set();for(const type of ['keydown','keyup'])window.addEventListener(type,e=>{const key=e.code||e.key,control=e.target&&e.target.closest&&e.target.closest('#tools,#loading,#rotate,#preview-tools');if(control||pageKeys.has(key)){if(type==='keydown')pageKeys.add(key);else pageKeys.delete(key);e.stopImmediatePropagation();}},true);
for(const type of ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend','touchcancel','mousedown','mouseup'])window.addEventListener(type,e=>{if(e.target&&e.target.closest&&e.target.closest('#tools,#loading,#rotate,#preview-tools'))e.stopImmediatePropagation();},true);
window.addEventListener('blur',()=>pageKeys.clear());
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script>
