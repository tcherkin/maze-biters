<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02080b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Maze Biters · iPad</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02080b;color:#d9f7f5;font-family:system-ui,sans-serif;touch-action:none}#canvas{display:block;width:100%;height:100%;object-fit:contain;outline:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(ellipse at center,#08232b,#02080b 70%);z-index:5}h1{letter-spacing:.18em;font-weight:500;font-size:clamp(22px,5vw,48px);margin:0}#load-message{min-height:24px;color:#91bdc4}progress{width:min(320px,70vw);height:6px;accent-color:#5de8cf}button,a{font:inherit;color:inherit;background:#09212b;border:1px solid #30606b;border-radius:8px;padding:10px 18px;text-decoration:none;cursor:pointer}button:hover{background:#15404d}#tools{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;opacity:.55;z-index:4}#tools:hover,#tools:focus-within{opacity:1}#tools button{padding:7px 10px;font-size:13px}#asset-status{position:fixed;bottom:8px;left:12px;font-size:12px;color:#a0c5cc;pointer-events:none}#diagnostic{display:none;position:fixed;left:0;top:0;max-width:100%;max-height:35%;overflow:auto;background:#000c;color:#b8ffc4;font:11px monospace;white-space:pre-wrap;pointer-events:none;z-index:8}.hint{text-align:center;max-width:34em;padding:0 20px;color:#91adb5;font-size:14px;line-height:1.6}#retry{display:none}
</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="Maze Biters — игра"></canvas>
<div id="loading"><h1>MAZE BITERS</h1><div id="load-message">iPad · Web</div><progress id="progress" max="1" value="0"></progress><button id="start">Докосни за начало</button><button id="retry">Опитай отново</button><p class="hint">Плъзгай с пръст за движение. С клавиатура: стрелки или WASD. Менюто запазва всички режими; за втори човек използвай клавиатура или контролер.</p></div>
<div id="tools"><button id="pause" title="Пауза">Ⅱ</button><button id="menu">Меню</button><button id="full">Цял екран</button></div><div id="asset-status"></div><pre id="diagnostic"></pre>
<script>
const canvas=document.querySelector('#canvas'),loading=document.querySelector('#loading'),message=document.querySelector('#load-message'),progress=document.querySelector('#progress'),asset=document.querySelector('#asset-status'),diag=document.querySelector('#diagnostic');
let unity;const diagnostics=new URLSearchParams(location.search).has('diagnostic');if(diagnostics)diag.style.display='block';
window.mazeWebStatus=(text,value,phase)=>{if(phase===0){loading.style.display='flex';message.textContent=text;progress.value=value;}else if(phase===1){loading.style.display='none';asset.textContent=text+' '+Math.round(value*100)+'%';}else if(phase===2){loading.style.display='none';asset.textContent='';}else{loading.style.display='flex';message.textContent=text;document.querySelector('#retry').style.display='block';}};
window.mazeWebState=json=>{if(diagnostics)diag.textContent=json;try{const q=JSON.parse(json).quality;if(q){const w=q==="4k"?2752:1376,h=q==="4k"?2064:1032;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}}catch(e){}};
const errors=[];function failed(text){errors.push(String(text));if(diagnostics)diag.textContent=errors.join('\n');loading.style.display='flex';message.textContent=String(text);document.querySelector('#retry').style.display='block';}
window.addEventListener('error',e=>{if(diagnostics){errors.push(e.message);diag.textContent=errors.join('\n');}});
function fit(){const aspect=4/3;let w=innerWidth,h=innerHeight;if(w/h>aspect)w=h*aspect;else h=w/aspect;canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.style.margin=((innerHeight-h)/2)+'px auto';}addEventListener('resize',fit);fit();
async function boot(){document.querySelector('#start').style.display='none';message.textContent='Зареждане на играта…';
 try{const script=document.createElement('script');script.src='Build/iPad.loader.js';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.body.appendChild(script);});
 unity=await createUnityInstance(canvas,{dataUrl:'Build/iPad.data.unityweb',frameworkUrl:'Build/iPad.framework.js.unityweb',codeUrl:'Build/iPad.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Maze Biters',productName:'Maze Biters iPad Web',productVersion:'1.0',matchWebGLToCanvasSize:false,autoSyncPersistentDataPath:true,cacheControl:url=>'must-revalidate',showBanner:(text,type)=>{if(type==='error')failed(text);}},value=>{progress.value=value;message.textContent='Зареждане на играта… '+Math.round(value*100)+'%';});canvas.width=1376;canvas.height=1032;canvas.focus();
 }catch(e){failed('Неуспешно зареждане. '+(e.message||e));}}
document.querySelector('#start').onclick=boot;document.querySelector('#retry').onclick=()=>unity?unity.SendMessage('Web loading','Retry'):location.reload();
document.querySelector('#menu').onclick=()=>{unity?.SendMessage('Web loading','Menu');canvas.focus();};document.querySelector('#pause').onclick=()=>{unity?.SendMessage('Web loading','Pause');canvas.focus();};
document.querySelector('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});canvas.focus();};
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
